[project]
name = "server"
version = "0.1.0"
description = "ottrip server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.15.1",
    "asyncpg>=0.30.0",
    "bcrypt>=4.3.0",
    "fastapi[standard]>=0.115.11",
    "greenlet>=3.1.1",
    "httpx>=0.28.1",
    "sendgrid>=6.11.0",
    "passlib>=1.7.4",
    "pydantic-settings>=2.8.1",
    "pyjwt[crypto]>=2.10.1",
    "sqlalchemy[asyncio]>=2.0.39",
    "aioboto3>=14.1.0",
    "types-aioboto3[s3]>=14.1.0",
    "google-cloud-vision>=3.7.0",
    "google-genai>=1.0.0",
    "pymupdf>=1.26.4",
    "openpyxl>=3.1.0",
    "resend>=2.19.0",
    "sentry-sdk[fastapi]>=2.48.0",
]

[dependency-groups]
dev = [
    "alembic>=1.15.1",
    "poethepoet>=0.33.1",
    "pre-commit>=4.2.0",
    "pyright>=1.1.397",
    "ruff>=0.11.2",
]

[tool.poe.tasks]
setup = "pre-commit install"
dev = "fastapi dev app/main.py --port 8080"
prod = "fastapi run app/main.py --host=0.0.0.0"
typecheck = "pyright"
lint = "ruff check"
format = "ruff format"
db = "docker compose -f docker-compose.dev.yml"
revision = "alembic revision --autogenerate"
migrate = "alembic upgrade head"
downgrade = "alembic downgrade -1"
check-migrations = "alembic check"
